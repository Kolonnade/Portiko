{{define "passkey-reauth"}}<script>
// withReauth runs call, a function returning {status, ok, out}. When the answer
// is 403 reauthentication_required — the change needs a sign-in in the last few
// minutes — it signs in again as the account and runs call once more. Signing
// in again as the account, with a passkey or its password, is that sign-in.
const b64uToBuf = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
const bufToB64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

// askPassword offers the account's password as the way to confirm, for an
// account that has one (the page sets REAUTH_PASSWORD). It resolves to
// {how: 'password' | 'passkey' | 'cancel', pw}.
function askPassword() {
  return new Promise(resolve => {
    const d = document.createElement('dialog');
    d.innerHTML = '<form method="dialog"><p>Confirm it is you.</p>' +
      '<label>Password <input type="password" autocomplete="current-password"></label>' +
      '<p><button value="password">Confirm</button> <button value="passkey">Use a passkey instead</button> ' +
      '<button value="cancel">Cancel</button></p></form>';
    document.body.appendChild(d);
    d.addEventListener('close', () => {
      const pw = d.querySelector('input').value;
      const how = d.returnValue || 'cancel';
      d.remove();
      resolve({ how, pw });
    });
    d.showModal();
  });
}

async function reauth(api, email, msg) {
  if (typeof REAUTH_PASSWORD !== 'undefined' && REAUTH_PASSWORD) {
    const { how, pw } = await askPassword();
    if (how === 'cancel') throw new Error('cancelled');
    if (how === 'password') {
      msg('Checking…');
      const r = await fetch(api + '/login/password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pw }),
      });
      if (!r.ok) throw new Error('password refused');
      return;
    }
  }
  msg('Confirm it is you with your passkey…');
  const r = await fetch(api + '/login/start' + (email ? '?email=' + encodeURIComponent(email) : ''));
  if (!r.ok) throw new Error('start failed');
  const options = (await r.json()).publicKey;
  options.challenge = b64uToBuf(options.challenge);
  (options.allowCredentials || []).forEach(c => c.id = b64uToBuf(c.id));
  const cred = await navigator.credentials.get({ publicKey: options });
  const f = await fetch(api + '/login/finish', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      id: cred.id, rawId: bufToB64u(cred.rawId), type: cred.type,
      response: {
        clientDataJSON: bufToB64u(cred.response.clientDataJSON),
        authenticatorData: bufToB64u(cred.response.authenticatorData),
        signature: bufToB64u(cred.response.signature),
        userHandle: cred.response.userHandle ? bufToB64u(cred.response.userHandle) : null,
      },
    }),
  });
  if (!f.ok) throw new Error('finish failed');
}

async function withReauth(call, api, email, msg) {
  let res = await call();
  if (res.status === 403 && res.out.error === 'reauthentication_required') {
    try { await reauth(api, email, msg); } catch (e) { msg('It was not confirmed, so nothing changed.'); return null; }
    res = await call();
  }
  return res;
}
</script>{{end}}
