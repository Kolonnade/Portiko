<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Adding}}Add an account{{else}}Sign in{{end}} — {{.ServiceName}}</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 24rem; margin: 4rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  input, button { font: inherit; width: 100%; padding: .6rem .7rem; margin-top: .5rem;
                  border-radius: .4rem; border: 1px solid currentColor; box-sizing: border-box; }
  button { cursor: pointer; }
  .step { display: none; } .step.on { display: block; }
  .msg { margin-top: 1rem; min-height: 1.5rem; }
  .muted { opacity: .7; font-size: .9rem; }
</style>

<h1>{{if .Adding}}Add another account{{else}}Sign in to {{.ServiceName}}{{end}}</h1>

<div id="passkey" class="step on">
  <button id="usePasskey">Use a passkey</button>
  <p class="muted">Or <a href="#" id="showEmail">sign in with your email</a>.</p>
  {{if .Adding}}<p class="muted"><a href="/">Back to your accounts</a></p>{{end}}
</div>

<div id="emailStep" class="step">
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username webauthn" required>
  {{if .CodeRequired}}<label for="bootstrap">Invitation code <span class="muted">(new accounts only)</span></label>
  <input id="bootstrap" type="text" autocomplete="off" spellcheck="false">{{end}}
  <button id="sendCode">Send me a code</button>
</div>

<div id="codeStep" class="step">
  <label for="code">Six-digit code</label>
  <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
  <button id="verify">Continue</button>
</div>

<p class="msg" id="msg" role="status"></p>

<script>
// All binary values crossing this boundary are unpadded base64url. Padded or
// standard base64 breaks the ceremony with no useful error, so the conversion
// lives in exactly these two helpers and nowhere else.
const b64uToBuf = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
const bufToB64u = b => btoa(String.fromCharCode(...new Uint8Array(b)))
  .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

// When a site sent the person here, the ceremony completes that site's sign-in
// and the server says where to go next.
const AUTH_REQUEST = {{.AuthRequestID}};
const RETURN_TO = {{.ReturnTo}};
const ADDING = {{.Adding}};
const finishQuery = AUTH_REQUEST ? '?authRequestID=' + encodeURIComponent(AUTH_REQUEST) : '';

const msg = t => document.getElementById('msg').textContent = t;
const show = id => document.querySelectorAll('.step')
  .forEach(el => el.classList.toggle('on', el.id === id));

// A conditional-UI ceremony may be in flight; abort it before starting an
// explicit one or two challenges end up outstanding.
let pending = null;
const freshSignal = () => { if (pending) pending.abort(); pending = new AbortController(); return pending.signal; };

document.getElementById('showEmail').onclick = e => { e.preventDefault(); show('emailStep'); };

document.getElementById('usePasskey').onclick = async () => {
  msg('Waiting for your passkey…');
  try {
    const r = await fetch('/accounts/v1/login/start');
    if (!r.ok) throw new Error('start failed');
    const options = (await r.json()).publicKey;
    options.challenge = b64uToBuf(options.challenge);
    (options.allowCredentials || []).forEach(c => c.id = b64uToBuf(c.id));

    const cred = await navigator.credentials.get({ publicKey: options, signal: freshSignal() });
    await finish('/accounts/v1/login/finish', {
      id: cred.id, rawId: bufToB64u(cred.rawId), type: cred.type,
      response: {
        clientDataJSON: bufToB64u(cred.response.clientDataJSON),
        authenticatorData: bufToB64u(cred.response.authenticatorData),
        signature: bufToB64u(cred.response.signature),
        userHandle: cred.response.userHandle ? bufToB64u(cred.response.userHandle) : null,
      },
    });
  } catch (e) {
    msg('That did not work. Try your email instead.');
    show('emailStep');
  }
};

document.getElementById('sendCode').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  if (!email) return;
  const r = await fetch('/accounts/v1/register/start', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, bootstrap_code: document.getElementById('bootstrap')?.value.trim() || '' }),
  });
  if (r.status === 403) {
    // The site's own registration policy said no, and says why.
    const body = await r.json().catch(() => ({}));
    msg(body.error_description || 'Registration is currently closed.');
    return;
  }
  // Deliberately the same message whether or not the address has an account.
  msg('If that address can receive mail, a code is on its way.');
  show('codeStep');
};

document.getElementById('verify').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const code = document.getElementById('code').value.trim();
  msg('Checking…');
  const r = await fetch('/accounts/v1/register/verify', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, code }),
  });
  if (!r.ok) { msg('That code did not work.'); return; }

  const options = (await r.json()).creation_options.publicKey;
  options.challenge = b64uToBuf(options.challenge);
  options.user.id = b64uToBuf(options.user.id);
  (options.excludeCredentials || []).forEach(c => c.id = b64uToBuf(c.id));

  msg('Create a passkey to finish.');
  try {
    const cred = await navigator.credentials.create({ publicKey: options, signal: freshSignal() });
    await finish('/accounts/v1/register/finish', {
      id: cred.id, rawId: bufToB64u(cred.rawId), type: cred.type,
      response: {
        clientDataJSON: bufToB64u(cred.response.clientDataJSON),
        attestationObject: bufToB64u(cred.response.attestationObject),
      },
    });
  } catch (e) {
    msg('Could not create a passkey on this device.');
  }
};

async function finish(url, body) {
  const r = await fetch(url + finishQuery, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) {
    msg(out.error === 'too_many_accounts'
      ? 'This browser already holds as many accounts as it can. Sign out of one first.'
      : 'Sign-in failed.');
    return;
  }
  window.location = AUTH_REQUEST ? out.redirect : (RETURN_TO || out.redirect || '/');
}
</script>

{{template "auth-watch"}}
<script>
// Signed in from another tab while this one waited: carry on to where this tab
// was going. Not while adding an account — this browser is already signed in.
if (!ADDING) {
  watchAuth({ signedIn: () => {
    window.location = AUTH_REQUEST ? '/login?authRequestID=' + encodeURIComponent(AUTH_REQUEST) : (RETURN_TO || '/');
  } });
}
</script>
