{{define "passkey-signal"}}<script>
// Tells the passkey provider the account's current name, so a saved passkey is
// labeled with the profile name rather than whatever it was created with.
// The Signal API is feature-detected: where it is missing nothing happens, and
// the next visit from a browser that has it catches up.
async function signalPasskeyDetails(s) {
  if (!s || !s.name || !s.user_ids || !s.user_ids.length) return;
  if (!window.PublicKeyCredential || !PublicKeyCredential.signalCurrentUserDetails) return;
  for (const userId of s.user_ids) {
    try {
      await PublicKeyCredential.signalCurrentUserDetails({
        rpId: s.rp_id, userId, name: s.name, displayName: s.name,
      });
    } catch (e) { /* best effort; the provider may not hold this handle */ }
  }
}

// signalPasskeyDetailsOnce signals a name only when this browser has not already
// signaled it for this profile version. The provider shows a notification for
// every call, name changed or not, so signaling on every page load nags. A
// browser that has never signaled still catches up once — which is what makes a
// name saved elsewhere reach this browser's provider — and then stays quiet.
// Without storage it does nothing: the save itself already signaled.
async function signalPasskeyDetailsOnce(s, version) {
  if (!s || !s.name || !s.user_ids || !s.user_ids.length || !version) return;
  const key = 'portiko.passkey-signal.' + s.rp_id + '.' + s.user_ids.join('.');
  const stamp = version + ':' + s.name;
  try { if (localStorage.getItem(key) === stamp) return; } catch (e) { return; }
  await signalPasskeyDetails(s);
  try { localStorage.setItem(key, stamp); } catch (e) { /* nothing to remember with */ }
}
</script>{{end}}
